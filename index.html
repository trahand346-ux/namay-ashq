<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>نامەیەکی تایبەت</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #2b0a18, #0d0509 75%);
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 105, 150, 0.25);
      border-radius: 28px;
      padding: 28px 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
      max-height: 90vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .hint {
      font-size: 15px;
      color: #ffd6e5;
      margin-bottom: 28px;
      line-height: 1.7;
    }

    .scanner-wrap {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.14);
    }

    svg.progress-ring {
      position: absolute;
      inset: 0;
      width: 140px;
      height: 140px;
      transform: rotate(-90deg);
    }

    .progress-circle {
      fill: none;
      stroke: #ff3b7f;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 390;
      stroke-dashoffset: 390;
      filter: drop-shadow(0 0 8px rgba(255, 59, 127, 0.8));
    }

    .fingerprint-icon {
      width: 78px;
      height: 78px;
      stroke: #ff85b0;
      fill: none;
      stroke-width: 2.1;
      stroke-linecap: round;
      transition: transform 0.2s ease, stroke 0.2s ease;
    }

    .scanner-wrap.active .fingerprint-icon {
      transform: scale(1.08);
      stroke: #ff3b7f;
    }

    .status {
      font-size: 13px;
      color: #d8a6b8;
      min-height: 20px;
    }

    .message-box {
      display: none;
      animation: fadeUp 0.7s ease forwards;
      text-align: right;
    }

    .message-box.show {
      display: block;
    }

    .music-wrap {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      margin: 0 0 18px;
      border: 1px solid rgba(255, 122, 168, 0.3);
      background: rgba(0, 0, 0, 0.35);
    }

    .music-label {
      font-size: 12.5px;
      color: #ffd6e5;
      padding: 8px 12px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .music-player-box {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
    }

    .music-player-box iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .heart {
      font-size: 46px;
      margin-bottom: 10px;
      text-align: center;
      animation: beat 1.2s infinite;
    }

    .msg-title {
      font-size: 20px;
      font-weight: 700;
      color: #ff7aa8;
      margin: 0 0 18px;
      text-align: center;
      line-height: 1.6;
    }

    .msg-body {
      font-size: 15.5px;
      line-height: 1.95;
      color: #fff2f6;
      margin: 0 0 24px;
      user-select: text;
      -webkit-user-select: text;
    }

    .msg-body p {
      margin: 0 0 16px;
      white-space: pre-line;
    }

    .btn-wrap {
      text-align: center;
      padding-bottom: 8px;
    }

    .reset-btn {
      background: rgba(255, 59, 127, 0.18);
      border: 1px solid rgba(255, 122, 168, 0.45);
      color: #fff;
      padding: 10px 22px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="scanView">
      <p class="hint">پەنجەت لەسەر پەنجەمۆرەکە ڕابگرە<br>تا نامە تایبەتەکەت بۆ بکرێتەوە</p>

      <div class="scanner-wrap" id="scanner">
        <div class="ring"></div>
        <svg class="progress-ring" viewBox="0 0 140 140">
          <circle class="progress-circle" id="progressCircle" cx="70" cy="70" r="62"></circle>
        </svg>
        <svg class="fingerprint-icon" viewBox="0 0 64 64">
          <path d="M20 26c0-6.6 5.4-12 12-12s12 5.4 12 12" />
          <path d="M15 30c0-9.4 7.6-17 17-17s17 7.6 17 17v4c0 9-4 17-10 22" />
          <path d="M24 27c0-4.4 3.6-8 8-8s8 3.6 8 8v8c0 6.5-2.5 12.5-7 17" />
          <path d="M28 28c0-2.2 1.8-4 4-4s4 1.8 4 4v7c0 4.5-1.5 8.5-4.5 11.5" />
          <path d="M16 38c0 7.5-3 14-8 18" />
        </svg>
      </div>

      <div class="status" id="statusText">بۆ ماوەی ٢ چرکە ڕایبگرە</div>
    </div>

    <div class="message-box" id="messageView">
      <div class="music-wrap">
        <div class="music-label">🎵 Rozita - Sangina</div>
        <div class="music-player-box">
          <div id="ytPlayer"></div>
        </div>
      </div>

      <div class="heart">❤️</div>
      <h1 class="msg-title" id="msgTitle"></h1>
      <div class="msg-body" id="msgBody"></div>
      <div class="btn-wrap">
        <button class="reset-btn" id="resetBtn">بینینەوەی دووبارە</button>
      </div>
    </div>
  </div>

  <script>
    const messageTitle = "❤️ بۆ ئەو کەسەی کە بووەتە جوانترین بەشی ژیانم...";

    const messageParagraphs = [
      "نەزانم لە کوێوە دەست پێ بکەم و چۆن ئەو هەموو هەستە جوانانەی ناو دڵم بۆت دەرببڕم، چونکە هەرچی وشەی جوان لە دنیا هەیە، هێشتا ناتوانێت بە تەواوی ئەو هەستەی ناو دڵمی بۆ تۆ وەسف بکات. تۆ لەوانە نەیت کە تەنها بە وشە بناسرێیت، تۆ لەوانەیت کە بە هەست دەناسرێیت، بەو ئارامییەی کە بە بوونت دەیبەخشیت، بەو خۆشییەی کە بە قسەیەکی بچووکت دێتە ناو دڵم.",
      "دەزانیت چی؟ هەندێک کەس بەبێ ئەوەی خۆیان بزانن دەبنە هۆی خۆشییەکی گەورە لە ژیانی کەسێکدا، تۆش یەکێکیت لەو کەسانە. بوونت بۆ من مانایەکی تایبەتی هەیە، قسەکردنت، پێکەنینت، تەنانەت بێدەنگییەکانیشت هەموویان لەبیرم نامێنن و جێگایەکی تایبەتیان لە دڵمدایە.",
      "من ناتەوێت تەنها لە کاتی خۆشیدا لە تەنیشتت بم، دەمەوێت لە ڕۆژە ناخۆشەکانیشتدا کەسێک هەبێت کە گوێت لێ بگرێت، دڵت ئارام بکاتەوە و پێت بڵێت هەرچی ڕووبدات، تۆ شایەنی خۆشترین شتەکانی ژیانیت. دەمەوێت هەمیشە هۆکارێک بم بۆ پێکەنینت، نەک هۆکاری فرمێسک و دڵتەنگییەکانت.",
      "ئەگەر هەموو دنیا لە دژی تۆ بوو، دەمەوێت بزانیت کە هێشتا کەسێک هەیە کە بە دڵێکی پاک حەزی لە خۆشحالیتە. ئەگەر ڕۆژێک ماندوو بوویت لە هەموو شتێک، دەمەوێت بتوانیت بەبێ ترس قسە بکەیت و خۆت بیت، چونکە تۆ پێویست ناکات لەبەردەم من خۆت بگۆڕیت یان ڕۆڵی کەسێکی تر ببینیت.",
      "لە نێو هەموو ئەو کەسانەی کە لە ژیاندا دەیانبینین، هەندێکیان تەنها بەسەر ڕێگاماندا تێدەپەڕن، بەڵام هەندێکی تریان شوێنێکی هەمیشەیی لە دڵماندا دروست دەکەن. تۆ بۆ من لە جۆری دووەمی، کەسێکیت کە بوونی بە ئاسانی لەبیر ناکرێت.",
      "دەمەوێت هەمیشە جوانترین خەونەکانت ببینیت، هەمیشە چاوت پڕ بێت لە بریسکەی خۆشی، هەمیشە دڵت ئارام بێت و هیچ شتێک ئەو پێکەنینە جوانەت لێ نەستێنێت.",
      "ئەگەر بپرسی بۆچی ئەوەندە گرنگیت پێ دەدەم، وەڵامەکەم زۆر سادەیە: چونکە تۆ خۆتیت، بە هەموو جوانی و تایبەتمەندییەکانتەوە. من پێویستم بە هۆکارێکی گەورە نییە بۆ ئەوەی نرخ و گرنگیت بزانم.",
      "لە کۆتاییدا تەنها ئەوەم پێت دەڵێم: سوپاس بۆ ئەوەی هەیت، سوپاس بۆ ئەو ساتە جوانانەی کە بە بوونت دروستت کردوون، سوپاس بۆ ئەوەی بوویتە کەسێکی تایبەت لە ژیانمدا.",
      "هیوادارم هەرگیز ئەوە لەبیر نەکەیت کە کەسێک هەیە بە دڵێکی پاک ئارەزووی خۆشی و سەرکەوتنت دەکات. تۆ شایەنی خۆشەویستی، ڕێز، ئارامی و هەموو جوانییەکانی ئەم ژیانەیت. ❤️🥹",
      "تۆ تەنها کچێکی ئاسایی نیت لە ژیانی مندا، تۆ ئەو کەسەیت کە بوونی جیاوازییەکی جوانی لە دڵمدا دروست کردووە. ❤️",
      "بە دەنگی بەرز ئەڵێم ؛\nبە هەموو باشی و خراپیەکانی رۆح و جەستەوە\nبەبێ بیانوو ، ئەویندارانە تۆم خۆشدەوێ",
      "💙✨",
      "خۆشم ئەوێیت بەڵام وەک ئەوان نا من دڵتەنگیتم بەڕادێک خۆش ئەوێ کە خەمباری ئەڵێم خوایە دڵتەنگی ئەوم بەرێ کە دڵت ئەشکێ من لێرەوە دڵم تەنگ ئەبێ کە بێزار ئەبی من لێرەوە ئۆقرەم نامێنێ\nتۆ لەوسەرەوە شتێکت لێبێ من لێرەوە گوێم لێ ئەبێ ئێستا تێئەگەی من چۆن خۆشم ئەوێی بەڕادێک بۆتۆ گوێم لە لێدانی دڵی خۆم نیه بۆ تۆ گوێم لە شکانو وردوو خاش بوونی خۆم نیه بۆتۆ بومەتە ئەو تەختە دارەی ئاگای لە دڵی خۆی نیە من ناشرینترین ناشرینیەکانتم خۆشەوێ بۆ جوانیەکانت باشترین سەرنجم هەیەو بۆ خراپیەکانت کوێرترین چاوم هەیە",
      "💙",
      "دونیاش دەستم لێ بەربدات من هەرگیز دەست لەتۆ بەرنادەم",
      "💙✨",
      "خۆشەویستی پێویستی بە زمانێک نییە بۆ گەیاندن، پێویستی بە هەستێکە لێت بگات و ئارامت بکاتەوە لەکاتی توڕەییت، پێویستی بە دەستێکە کە لەکاتی بێتاقەتی و بێ هیواییت هیوات بداتەوە، لە جەنجاڵییەکانی ژیان دەرت بهێنێت و بتباتەوە کەناری دەریا🤴🏻🔐💙💍"
    ];

    const scanner = document.getElementById("scanner");
    const progressCircle = document.getElementById("progressCircle");
    const statusText = document.getElementById("statusText");
    const scanView = document.getElementById("scanView");
    const messageView = document.getElementById("messageView");
    const msgTitle = document.getElementById("msgTitle");
    const msgBody = document.getElementById("msgBody");
    const resetBtn = document.getElementById("resetBtn");

    msgTitle.textContent = messageTitle;
    msgBody.innerHTML = "";
    messageParagraphs.forEach((text) => {
      const p = document.createElement("p");
      p.textContent = text;
      msgBody.appendChild(p);
    });

    let player = null;
    let playerReady = false;
    let shouldPlayOnReveal = false;

    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player("ytPlayer", {
        videoId: "uugEmKAU-5s",
        playerVars: {
          playsinline: 1,
          rel: 0
        },
        events: {
          onReady: function () {
            playerReady = true;
            if (shouldPlayOnReveal) {
              player.unMute();
              player.playVideo();
            }
          }
        }
      });
    };

    function triggerMusic() {
      shouldPlayOnReveal = true;
      if (playerReady && player && typeof player.playVideo === "function") {
        try {
          player.unMute();
          player.playVideo();
        } catch (err) {}
      }
    }

    const circumference = 390;
    const holdDuration = 2000;
    let progress = 0;
    let holding = false;
    let lastTime = null;
    let timerId = null;

    function setProgress(value) {
      const clamped = Math.max(0, Math.min(1, value));
      progressCircle.style.strokeDashoffset = circumference * (1 - clamped);
    }

    function revealMessage() {
      holding = false;
      clearInterval(timerId);
      timerId = null;
      scanner.classList.remove("active");
      scanView.style.display = "none";
      messageView.classList.add("show");
      triggerMusic();
    }

    function step() {
      const now = Date.now();
      if (!lastTime) lastTime = now;
      const dt = now - lastTime;
      lastTime = now;

      if (holding) {
        progress += dt / holdDuration;
        statusText.textContent = `خەریکە دەکرێتەوە... ${Math.min(100, Math.round(progress * 100))}%`;
        setProgress(progress);

        if (progress >= 1) {
          revealMessage();
        }
      } else {
        progress -= dt / 350;
        if (progress <= 0) {
          progress = 0;
          setProgress(0);
          statusText.textContent = "بۆ ماوەی ٢ چرکە ڕایبگرە";
          clearInterval(timerId);
          timerId = null;
          lastTime = null;
        } else {
          setProgress(progress);
        }
      }
    }

    function startHold(e) {
      if (e && e.cancelable) e.preventDefault();
      holding = true;
      lastTime = Date.now();
      scanner.classList.add("active");
      if (!timerId) {
        timerId = setInterval(step, 30);
      }
    }

    function stopHold() {
      if (!holding) return;
      holding = false;
      scanner.classList.remove("active");
      lastTime = Date.now();
      if (!timerId) {
        timerId = setInterval(step, 30);
      }
    }

    scanner.addEventListener("touchstart", startHold, { passive: false });
    scanner.addEventListener("mousedown", startHold);
    window.addEventListener("touchend", stopHold);
    window.addEventListener("touchcancel", stopHold);
    window.addEventListener("mouseup", stopHold);

    resetBtn.addEventListener("click", () => {
      shouldPlayOnReveal = false;
      if (playerReady && player && typeof player.pauseVideo === "function") {
        try {
          player.pauseVideo();
        } catch (err) {}
      }
      progress = 0;
      setProgress(0);
      statusText.textContent = "بۆ ماوەی ٢ چرکە ڕایبگرە";
      messageView.classList.remove("show");
      scanView.style.display = "block";
    });
  </script>
</body>
</html>
